shutdown_costmaps: false
controller_frequency: 10.0
planner_patience: 5.0
controller_patience: 15.0
conservative_reset_dist: 3.0
planner_frequency: 5.0
oscillation_timeout: 10.0
oscillation_distance: 0.2
recovery_behavior_enabled: false

base_global_planner: "global_planner/GlobalPlanner"
base_local_planner: "dwa_local_planner/DWAPlannerROS"
#base_local_planner: "teb_local_planner/TebLocalPlannerROS"

GlobalPlanner:
  allow_unknown: true
  use_dijkstra: true
  use_quadratic: true
  use_grid_path: false
  old_navfn_behavior: false
  visualize_potential: false
  cost_factor: 2.0
  neutral_cost: 66
  lethal_cost: 180
  #default_tolerance: 0.30

#Planejador Local DWA

DWAPlannerROS:
 
  max_vel_trans: 0.07
  min_vel_trans: 0.02
  acc_lim_trans: 0.4

  max_vel_x: 0.07
  min_vel_x: 0.02

  max_vel_y: 0.0
  min_vel_y: 0.0

  max_vel_theta: 0.8
  min_vel_theta: 0.2
  min_in_place_vel_theta: 0.15

  acc_lim_x: 0.4
  acc_lim_y: 0.0
  acc_lim_theta: 2.5

  holonomic_robot: false


  sim_time: 1.5
  vx_samples: 16
  vy_samples: 1
  vth_samples: 32

  forward_point_distance: 0.2
  stop_time_buffer: 0.25 
  scaling_speed: 0.05
  max_scaling_factor: 0.2

  path_distance_bias: 24.0
  goal_distance_bias: 14.0
  occdist_scale: 0.35
  prune_plan: true

  xy_goal_tolerance: 0.30
  yaw_goal_tolerance: 1.57
  latch_xy_goal_tolerance: true

#Planejador Local TEB

TebLocalPlannerROS:
  odom_topic: odom
  map_frame: map

  max_vel_x: 0.20
  max_vel_x_backwards: 0.05
  max_vel_theta: 0.8

  acc_lim_x: 0.4
  acc_lim_theta: 1.0

  min_turning_radius: 0.0
  wheelbase: 0.25
  cmd_angle_instead_rotvel: false


  footprint_model:
    type: "polygon"
    vertices: [[0.15, 0.10], [0.15, -0.10], [-0.15, -0.10], [-0.15, 0.10]]

  xy_goal_tolerance: 0.15
  yaw_goal_tolerance: 0.20
  free_goal_vel: false

  include_costmap_obstacles: true
  costmap_obstacles_behind_robot_dist: 1.0

  obstacle_poses_affected: 15
  inflation_dist: 0.30
  min_obstacle_dist: 0.15

  teb_autosize: true
  dt_ref: 0.3
  dt_hysteresis: 0.1
